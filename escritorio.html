<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAURAKI · Escritório</title>
<style>
:root{--bg:#0b0f17;--pn:#121826;--pn2:#182033;--ln:#243049;--tx:#e6ebf5;--mu:#8a96b0;--ac:#38bdf8;--ok:#34d399;--wn:#fbbf24;--er:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}}
#stage{position:relative;min-height:0;overflow:auto;background:radial-gradient(1200px 600px at 30% 0%,#111a2c,#0b0f17)}
canvas{width:100%;height:100%;min-height:640px;display:block}
header{position:absolute;left:14px;top:10px;pointer-events:none}
header b{font-size:18px;letter-spacing:.14em}
header span{display:block;color:var(--mu);font-size:11px;letter-spacing:.05em}
#demo{position:absolute;right:14px;top:10px;background:var(--wn);color:#111;font-weight:700;padding:3px 10px;border-radius:99px;font-size:12px;display:none}
aside{background:var(--pn);border-left:1px solid var(--ln);overflow:auto;padding:14px}
h3{margin:14px 0 6px;font-size:11px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.card b{display:block;font-size:20px}.card small{color:var(--mu)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #1b2438}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.ok{background:var(--ok)}.er{background:var(--er)}.wn{background:var(--wn)}
#aut{display:flex;align-items:center;gap:8px;justify-content:space-between}
.badge{padding:2px 10px;border-radius:99px;font-weight:700;font-size:12px}
.b-on{background:#06402c;color:var(--ok)}.b-off{background:#2a2f3d;color:var(--mu)}
#det{position:absolute;left:14px;bottom:14px;width:min(380px,calc(100% - 28px));max-height:55%;overflow:auto;background:rgba(18,24,38,.96);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:none;box-shadow:0 10px 30px #0008}
#det h2{margin:0 0 2px;font-size:17px}#det .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--mu);background:none;border:0;font-size:18px}
#det p{margin:4px 0}.nd{color:var(--mu);font-style:italic}
.conv{font-size:12px;color:var(--mu)}.conv b{color:var(--tx)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <header><b>SAURAKI</b><span>Inteligência conectada. Autonomia controlada. Evolução contínua.</span></header>
    <div id="demo">ANIMAÇÃO ILUSTRATIVA</div>
    <canvas id="c"></canvas>
    <div id="det"></div>
  </div>
  <aside>
    <div class="card" id="aut"><div><b style="font-size:14px">Autonomia</b><br><small id="autd">…</small></div><span class="badge b-off" id="autb">—</span></div>
    <h3>Agentes</h3>
    <div class="grid" id="cont"></div>
    <h3>Serviços</h3><div id="serv"></div>
    <h3>Recursos locais</h3><div id="rec"></div>
    <h3>Provedores de IA (uso hoje)</h3><div id="prov"></div>
    <h3>Conversa entre agentes</h3><div id="conv"></div>
    <p class="nd" id="nota" style="font-size:12px"></p>
  </aside>
</div>
<script>
"use strict";
var DEMO=true, snap=null, selecionado=null, seats=[], t0=performance.now();
var ROOMS=[ // um bloco (sala) por modulo; o Jarvis fica sozinho na sala dele (porta de entrada)
 {n:"Jarvis",a:["Jarvis"],c:"#38bdf8"},{n:"Finanças",a:["Cofre","Vaquinha"],c:"#34d399"},{n:"Operação",a:["Sultão","Ilhéu"],c:"#fb923c"},{n:"Família",a:["Alma"],c:"#f472b6"},
 {n:"Engenharia",a:["Forja","Ada"],c:"#a78bfa"},{n:"Exército",a:["Cabo Tito"],c:"#a3a380"},{n:"Rotina",a:["Compasso"],c:"#fbbf24"},{n:"Entradas",a:["Correio","Garimpeiro"],c:"#60a5fa"}];
var COR={ocioso:"#8a96b0",analisando:"#38bdf8",planejando:"#818cf8",executando:"#34d399",consultando:"#22d3ee",aguardando_autorizacao:"#fbbf24",aguardando_servico:"#fb923c",concluido:"#4ade80",erro:"#f87171",desconectado:"#4b5563"};
var CURTO={aguardando_autorizacao:"Aguarda OK",consultando:"Consultando",executando:"Executando",aguardando_servico:"Aguarda serviço"};
var ROT={ocioso:"Ocioso",analisando:"Analisando",planejando:"Planejando",executando:"Executando tarefa",consultando:"Consultando outro agente",aguardando_autorizacao:"Aguardando autorização humana",aguardando_servico:"Aguardando serviço externo",concluido:"Concluído",erro:"Erro",desconectado:"Desconectado"};
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ago(ts){if(!ts)return "dado não disponível";var s=Math.max(0,Date.now()/1000-ts);if(s<90)return "agora há pouco";if(s<3600)return "há "+Math.round(s/60)+" min";if(s<86400)return "há "+Math.round(s/3600)+" h";return "há "+Math.round(s/86400)+" d"}

function demoSnap(){ // DADOS SIMULADOS (so com ?demo=1): estados rotativos para ver as animacoes
  var PESOS=["ocioso","ocioso","ocioso","executando","ocioso","consultando","aguardando_autorizacao","ocioso","ocioso","ocioso","ocioso","planejando"];
  var nomes=["Jarvis","Compasso","Sultão","Ilhéu","Alma","Forja","Ada","Cofre","Vaquinha","Garimpeiro","Correio","Cabo Tito"],ests=PESOS,k=Math.floor(Date.now()/30000),c=Math.floor(Date.now()/26000);
  return {ts:Date.now()/1000,simulado:true,total:nomes.length,agentes:nomes.map(function(n,i){var e=ests[(i*5+k)%ests.length];return{nome:n,exibir:n==="Alma"?"A.L.M.A.":n,especialidade:"(simulado)",estado:e,motivo:"simulado",ultima_atividade:Date.now()/1000-i*40,tarefa:"tarefa simulada",atividades:[],avisos:[]}}),
   conversa:[{id:c*10+1,ts:0,de:"Jarvis",para:"Alma",tipo:"pedido",texto:"(simulado) consulta sobre família"},{id:c*10+2,ts:0,de:"Alma",para:"Cabo Tito",tipo:"pedido",texto:"(simulado) envolve o Exército também"},{id:c*10+3,ts:0,de:"Cabo Tito",para:"Alma",tipo:"resposta",texto:"(simulado) tenho 3 fatos"},{id:c*10+4,ts:0,de:"Alma",para:"Jarvis",tipo:"resposta",texto:"(simulado) juntei 5 fatos"}],contagem:{},autonomia:{armada:false},servicos:[{nome:"Braniac",ok:true}],provedores:[],recursos:{},nota:"Modo demonstração: nada aqui é real."}}

var chars={}, bolhas=[], ultimoMsg=null, lounge=null, deskPos={};
function layout(){ // salas em grade 3x2 + area de lazer larga embaixo
  var c=document.getElementById("c"),W=c.clientWidth,H=c.clientHeight,pad=14,top=54,cols=W<700?2:4,rows=W<700?4:2,lh=Math.max(120,H*(festa()?.46:.24)),gh=H-top-lh-pad*(rows+2),rw=(W-pad*(cols+1))/cols,rh=gh/rows;
  var byName={};if(snap)snap.agentes.forEach(function(a){byName[a.nome]=a});
  var usados={};ROOMS.forEach(function(r){r.a.forEach(function(n){usados[n]=1})});
  var extras=snap?snap.agentes.filter(function(a){return!usados[a.nome]}):[];
  var rooms=ROOMS.map(function(r,i){return{n:r.n,c:r.c,ag:r.a.filter(function(n){return byName[n]}).map(function(n){return byName[n]}),x:pad+(i%cols)*(rw+pad),y:top+Math.floor(i/cols)*(rh+pad),w:rw,h:rh}});
  if(extras.length)rooms[rooms.length-1].ag=rooms[rooms.length-1].ag.concat(extras); // agentes novos do registro entram na ultima sala
  seats=[];deskPos={};
  rooms.forEach(function(r){var n=r.ag.length,cl=Math.min(Math.max(n,1),2),rw2=Math.max(1,Math.ceil(n/cl));r.ag.forEach(function(a,i){var cx=r.x+r.w*((i%cl)+.5)/cl,cy=r.y+40+(r.h-40)*(Math.floor(i/cl)+.5)/rw2-6;seats.push({a:a,x:cx,y:cy,cw:r.w/cl});deskPos[a.nome]={x:cx,y:cy}})});
  lounge={n:"Área de lazer",c:"#f59e0b",x:pad,y:top+rows*(rh+pad),w:W-pad*2,h:lh};
  var L=lounge,u=L.w/12,my=L.y+L.h*.62;                     // pontos de lazer: sofa(sentar) x4, pingue-pongue x2, cafe, TV x2, conversa x3
  lounge.spots=[{x:L.x+u*1.1,y:my,t:"sofa"},{x:L.x+u*1.9,y:my,t:"sofa"},{x:L.x+u*2.7,y:my,t:"sofa"},{x:L.x+u*3.5,y:my,t:"sofa"},
    {x:L.x+u*5.2,y:my-14,t:"pong"},{x:L.x+u*6.8,y:my-14,t:"pong"},{x:L.x+u*8.2,y:my,t:"cafe"},{x:L.x+u*9.3,y:my+4,t:"tv"},{x:L.x+u*10.1,y:my+4,t:"tv"},
    {x:L.x+u*7.6,y:my+16,t:"papo"},{x:L.x+u*4.4,y:my+16,t:"papo"},{x:L.x+u*11.2,y:my+10,t:"papo"}];
  return rooms}
var visitas=[],atividadePeriodo=-1,atribuicao={};
var LAZER={cafe:"Tomando café",pong:"Jogando pingue-pongue",papo:"Batendo papo",sofa:"Descansando",tv:"Vendo TV",festa:"Na festa 🎉"};
function festa(){return !!(snap&&snap.festa_ate&&snap.festa_ate*1000>Date.now())}   // meta batida: so quem esta ocioso vai para a festa; quem trabalha continua trabalhando
function slotsLazer(L){ // posicoes de cada atividade (cada agente ocioso ocupa uma; com mais agentes que vagas, reaproveita com deslocamento)
  var u=L.w/12,my=L.y+L.h*.62;
  return [{t:"cafe",x:L.x+u*8.0,y:my+10},{t:"sofa",x:L.x+u*1.1,y:my},{t:"tv",x:L.x+u*9.3,y:my+10},
    {t:"pong",x:L.x+u*4.7,y:my-12,dir:1},{t:"pong",x:L.x+u*7.3,y:my-12,dir:-1},
    {t:"papo",x:L.x+u*9.9,y:my+22,dir:1},{t:"papo",x:L.x+u*10.8,y:my+22,dir:-1},
    {t:"cafe",x:L.x+u*8.5,y:my+22},{t:"sofa",x:L.x+u*1.9,y:my},{t:"tv",x:L.x+u*10.1,y:my+10},
    {t:"papo",x:L.x+u*3.6,y:my+24,dir:1},{t:"papo",x:L.x+u*4.4,y:my+24,dir:-1},
    {t:"sofa",x:L.x+u*2.7,y:my},{t:"sofa",x:L.x+u*3.5,y:my},{t:"papo",x:L.x+u*11.0,y:my+12,dir:1},{t:"papo",x:L.x+u*11.6,y:my+12,dir:-1}]}
function atribuirLazer(oc){ // a cada ~28 s os ociosos trocam de atividade (ordem embaralhada de forma estavel dentro do periodo)
  var per=Math.floor(Date.now()/28000),chave=oc.join("|")+(festa()?"|festa":"");
  if(per===atividadePeriodo&&chave===atribuicao._k)return;atividadePeriodo=per;atribuicao={_k:chave};
  if(festa()){var Lf=lounge,uf=Lf.w/12,cx=Lf.x+Lf.w*.5,cy=Lf.y+Lf.h*.62+4,nf=Math.max(oc.length,1);
    oc.forEach(function(n,i){var an=Math.PI*2*i/nf+per*0,rx=uf*(1.3+(i%2)*.5),ry=18+(i%2)*8;atribuicao[n]={t:"festa",x:cx+Math.cos(an)*rx,y:cy+Math.sin(an)*ry,dir:Math.cos(an)>0?-1:1}});return}
  var sl=slotsLazer(lounge),ordem=oc.slice().sort(function(a,b){return hue(a+per)-hue(b+per)||(a<b?-1:1)});
  ordem.forEach(function(n,i){var s=sl[i%sl.length],r=Math.floor(i/sl.length)*6;atribuicao[n]={t:s.t,x:s.x+r,y:s.y+r*.5,dir:s.dir||1}})}
function visitaAtiva(nome,agora){for(var i=0;i<visitas.length;i++){var v=visitas[i];if(v.de===nome&&agora>=v.ini&&agora<v.fim)return v}return null}
function recebendo(nome,agora){for(var i=0;i<visitas.length;i++){var v=visitas[i];if(v.para===nome&&agora>=v.ini-2500&&agora<v.fim)return v}return null}
function atualizarChars(dt){
  if(!snap)return;var agora=Date.now(),oc=snap.agentes.filter(function(a){return a.estado==="ocioso"||a.estado==null}).map(function(a){return a.nome}).sort();atribuirLazer(oc);
  visitas=visitas.filter(function(v){return agora<v.fim+500});
  snap.agentes.forEach(function(a){var d=deskPos[a.nome];if(!d)return;var ch=chars[a.nome];
    if(!ch){ch=chars[a.nome]={x:d.x,y:d.y+14,tx:d.x,ty:d.y+14,andando:false,pose:"mesa",fase:Math.random()*6,dir:1}}
    var v=visitaAtiva(a.nome,agora),lz=atribuicao[a.nome];ch.visitando=false;
    if(v&&deskPos[v.para]){var dd=deskPos[v.para];ch.tx=dd.x-40;ch.ty=dd.y+26;ch.pose="visita";ch.visitando=true}      // vai ate a sala de quem foi consultado
    else if((a.estado==="ocioso"||a.estado==null)&&lz&&!recebendo(a.nome,agora)){ch.tx=lz.x;ch.ty=lz.y;ch.pose=lz.t;ch.dirAlvo=lz.dir||1}
    else{ch.tx=d.x;ch.ty=d.y+14;ch.pose="mesa"}
    var dx=ch.tx-ch.x,dy=ch.ty-ch.y,dist=Math.hypot(dx,dy);
    if(dist>2){var vel=Math.min(dist,120*dt);ch.x+=dx/dist*vel;ch.y+=dy/dist*vel;ch.andando=true;ch.dir=dx<0?-1:1}else{ch.andando=false;if(ch.dirAlvo)ch.dir=ch.dirAlvo}})}
function novasMensagens(){
  if(!snap||!snap.conversa)return;var msgs=snap.conversa,ids=msgs.map(function(m){return m.id||0});
  if(ultimoMsg===null){ultimoMsg=Math.max.apply(null,ids.concat([0]));return}   // nao reprisa o historico ao abrir
  var novas=msgs.filter(function(m){return(m.id||0)>ultimoMsg}).sort(function(a,b){return a.id-b.id});if(!novas.length)return;
  ultimoMsg=novas[novas.length-1].id;var agora=Date.now(),viagens=novas.filter(function(m){return m.tipo==="pedido"||m.tipo==="alerta"}),fins=[];
  for(var k=viagens.length-1;k>=0;k--){var p=viagens[k],f=agora+k*7000+7000;      // Jarvis vai ate o agente (pedido) ou o agente vai ate o Jarvis (alerta); um de cada vez
    viagens.forEach(function(q,j){if(j>k&&q.de===p.para)f=Math.max(f,fins[j]+1500)});fins[k]=f}    // quem foi consultado e consulta outro: o primeiro espera na sala
  viagens.forEach(function(p,k){var ini=agora+k*7000,fim=fins[k],r=p.tipo==="pedido"?novas.filter(function(m){return m.tipo==="resposta"&&m.de===p.para&&m.para===p.de&&m.id>p.id})[0]:null;
    visitas.push({de:p.de,para:p.para,ini:ini,fim:fim});
    bolhas.push({de:p.de,para:p.para,texto:p.texto,t:ini+2200});
    if(r)bolhas.push({de:r.de,para:r.para,texto:r.texto,t:fim>ini+7500?fim-2800:ini+4800})});
  novas.filter(function(m){return m.tipo!=="pedido"&&m.tipo!=="resposta"&&m.tipo!=="alerta"}).forEach(function(m){bolhas.push({de:m.de,para:m.para,texto:m.texto,t:agora})})}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
var cam={z:1,x:0,y:0},brilhos=[],particulas=[],hover=null;
function dia(){var d=new Date(),h=d.getHours()+d.getMinutes()/60;return Math.max(0,Math.sin(Math.PI*(h-6)/12))} // 0 = noite, 1 = meio-dia
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function cor3(c1,c2,t){return"rgb("+mix(c1[0],c2[0],t)+","+mix(c1[1],c2[1],t)+","+mix(c1[2],c2[2],t)+")"}
function sombra(g,x,y,rx,ry,a){g.fillStyle="rgba(0,0,0,"+(a||.28)+")";g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function planta(g,x,y,s,t){s=s||1;sombra(g,x,y+9*s,9*s,3*s,.3);g.fillStyle="#6b3f22";rr(g,x-6*s,y,12*s,10*s,3);g.fill();g.fillStyle="#8a5230";g.fillRect(x-6*s,y,12*s,3*s);
  var bal=Math.sin((t||0)*1.4+x)*1.5;g.fillStyle="#15803d";[[-6,-3,-.5],[6,-3,.5],[0,-9,0],[-3,-7,-.25],[3,-7,.25]].forEach(function(p){g.save();g.translate(x+p[0]*s,y+p[1]*s);g.rotate(p[2]+bal*.03);g.beginPath();g.ellipse(0,-4*s,3.2*s,7*s,0,0,7);g.fill();g.restore()});
  g.fillStyle="#22c55e";[[-4,-6],[4,-6],[0,-12]].forEach(function(p){g.beginPath();g.ellipse(x+p[0]*s+bal*.2,y+p[1]*s,2.2*s,4.5*s,0,0,7);g.fill()})}
function ceuJanela(g,x,y,w,h,d,t){
  var gr=g.createLinearGradient(0,y,0,y+h);if(d>.35){gr.addColorStop(0,cor3([56,120,200],[125,200,250],d));gr.addColorStop(1,cor3([160,210,250],[225,242,255],d))}else{gr.addColorStop(0,"#050914");gr.addColorStop(1,"#14213d")}
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  if(d<=.35){g.fillStyle="#fff";for(var i=0;i<4;i++)g.fillRect(x+3+((i*37+x)%(w-6)),y+2+((i*11)%(h-6)),1.4,1.4);g.fillStyle="#fde68a";g.beginPath();g.arc(x+w*.72,y+h*.35,3,0,7);g.fill()}
  else{g.fillStyle="rgba(255,255,255,.55)";var cx=x+((t*3+x*3)%(w+24))-12;g.beginPath();g.ellipse(cx,y+h*.4,8,3,0,0,7);g.fill()}   // nuvem passando
  g.fillStyle="rgba(255,255,255,.10)";g.beginPath();g.moveTo(x+w*.1,y+h);g.lineTo(x+w*.5,y);g.lineTo(x+w*.7,y);g.lineTo(x+w*.3,y+h);g.fill()}   // reflexo no vidro
function sala(g,r,t,d){
  var base=r.c;g.save();
  g.shadowColor="rgba(0,0,0,.5)";g.shadowBlur=18;g.shadowOffsetY=6;g.fillStyle="#0e1422";rr(g,r.x,r.y,r.w,r.h,14);g.fill();g.shadowColor="transparent";
  rr(g,r.x,r.y,r.w,r.h,14);g.clip();
  g.fillStyle="#1a2236";g.fillRect(r.x,r.y,r.w,r.h);g.fillStyle=base+"1f";g.fillRect(r.x,r.y,r.w,r.h);          // piso
  for(var y=r.y+34,k=0;y<r.y+r.h;y+=15,k++){g.fillStyle=k%2?"rgba(255,255,255,.025)":"rgba(0,0,0,.05)";g.fillRect(r.x,y,r.w,15);                       // tabuas
    g.strokeStyle="rgba(0,0,0,.18)";g.lineWidth=1;for(var x=r.x+((k*37)%47);x<r.x+r.w;x+=47){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+15);g.stroke()}}
  var rug=g.createLinearGradient(r.x,r.y+60,r.x+r.w,r.y+r.h);rug.addColorStop(0,base+"33");rug.addColorStop(1,base+"18");g.fillStyle=rug;rr(g,r.x+r.w*.1,r.y+r.h*.34,r.w*.8,r.h*.58,16);g.fill();g.strokeStyle=base+"55";g.lineWidth=2;g.setLineDash([6,5]);rr(g,r.x+r.w*.1+6,r.y+r.h*.34+6,r.w*.8-12,r.h*.58-12,12);g.stroke();g.setLineDash([]);   // tapete
